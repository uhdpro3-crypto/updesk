name: Flutter Nightly Build

on:
  # UP-DESK: 매일 밤 자동 빌드 끔 — 켜 두면 받는 파일(nightly)을 매일 다시 만들어 덮어쓴다. 손으로만 실행.
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
# UP-DESK: built from safegaurd80-prog/updesk (separate repo, not a fork)
